<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz de Emergência - Planta da casa</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --txt:#1c2430; --mut:#5b6573; --ok:#1e8a50; --bad:#c5221f; --warn:#b06a00;
    --parede:#3a4350; --piso:#e9edf2;
    --luz:#fff1b8; --luz-txt:#4a3b00; --escuro:#1d2433; --escuro-txt:#ffffff; --sem:#d9dde3; --sem-txt:#4b5563;
    --linha:#3b82f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12161c; --card:#1c222b; --txt:#e8ecf1; --mut:#a3adba; --ok:#46c27d; --bad:#ff7b72; --warn:#e0a030;
      --parede:#9aa5b5; --piso:#262d38;
      --luz:#6a5920; --luz-txt:#fff6d0; --escuro:#0b0e14; --escuro-txt:#ffd9d6; --sem:#2a313c; --sem-txt:#aab4c2;
      --linha:#6aa5ff;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:1.3rem; margin:0; }
  .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .mut { color:var(--mut); font-size:.9rem; }
  .linha { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }

  /* resumo */
  .resumo { display:flex; flex-wrap:wrap; gap:10px; }
  .pill { padding:6px 12px; border-radius:999px; font-weight:600; font-size:.9rem; background:var(--piso); }
  .pill.bad { background:var(--bad); color:#fff; }
  @media (prefers-color-scheme: dark) { .pill.bad { color:#1a0000; } }

  /* planta */
  svg.planta { width:100%; height:auto; display:block; }
  .piso { fill:var(--piso); }
  .parede { fill:none; stroke:var(--parede); stroke-width:6; stroke-linejoin:round; }
  .porta { stroke:var(--card); stroke-width:8; stroke-linecap:butt; }
  .room { cursor:pointer; outline:none; }
  .room .fundo { stroke:var(--parede); stroke-width:3; transition:fill .35s; }
  .room.ok .fundo { fill:var(--luz); }
  .room.alerta .fundo { fill:var(--escuro); }
  .room.stale .fundo, .room.vazio .fundo { fill:var(--sem); }
  .room text { pointer-events:none; font-family:system-ui,sans-serif; }
  .room.ok text { fill:var(--luz-txt); }
  .room.alerta text { fill:var(--escuro-txt); }
  .room.stale text, .room.vazio text { fill:var(--sem-txt); }
  .room .nome { font-size:20px; font-weight:700; }
  .room .valor { font-size:44px; font-weight:700; }
  .room .estado { font-size:14px; }
  .room .led-off { fill:#6b7280; } .room .led-on { fill:#ff3b30; }
  .room:hover .fundo { filter:brightness(1.06); }
  .room:focus-visible .fundo, .room.sel .fundo { stroke:var(--linha); stroke-width:6; }
  .room.alerta .halo { animation:pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
  @media (prefers-reduced-motion: reduce) { .room.alerta .halo { animation:none; opacity:.6; } }

  /* detalhe */
  .valor-grande { font-size:3.2rem; font-weight:700; line-height:1; }
  .unidade { font-size:1.4rem; color:var(--mut); margin-left:4px; }
  .badge { padding:6px 12px; border-radius:999px; font-weight:600; font-size:.9rem; color:#fff; display:inline-block; }
  .b-ok { background:var(--ok); } .b-bad { background:var(--bad); } .b-warn { background:var(--warn); }
  @media (prefers-color-scheme: dark) { .b-ok, .b-bad, .b-warn { color:#101418; } }
  canvas { width:100%; height:220px; display:block; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid rgba(128,128,128,.25); }
  .tabela { max-height:220px; overflow:auto; margin-top:8px; }
  .legenda { display:flex; flex-wrap:wrap; gap:14px; font-size:.85rem; color:var(--mut); }
  .legenda i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--parede); }
</style>
</head>
<body>
<main>
  <h1>💡 Luz de Emergência — planta da casa</h1>

  <section class="card">
    <div class="linha" style="margin-bottom:12px">
      <div class="resumo" id="resumo" aria-live="polite"></div>
      <div class="legenda">
        <span><i style="background:var(--luz)"></i>Com luz</span>
        <span><i style="background:var(--escuro)"></i>Escuro (LED aceso)</span>
        <span><i style="background:var(--sem)"></i>Sem sinal</span>
      </div>
    </div>
    <svg class="planta" id="planta" viewBox="0 0 640 420" role="group" aria-label="Planta da casa com quatro cômodos"></svg>
    <p class="mut" style="margin-bottom:0">Clique em um cômodo para ver o histórico do sensor dele.</p>
  </section>

  <section class="card" id="detalhe">
    <div class="linha">
      <div>
        <strong id="d-nome" style="font-size:1.1rem">--</strong>
        <div class="mut" id="d-dev"></div>
        <div style="margin-top:8px"><span class="valor-grande" id="d-valor">--</span><span class="unidade" id="d-unidade"></span></div>
      </div>
      <div>
        <span class="badge b-warn" id="d-alerta">Aguardando</span>
      </div>
    </div>
    <p class="mut">Última atualização: <span id="d-hora">--</span></p>
    <p class="mut" id="d-msg"></p>
    <canvas id="grafico" role="img" aria-label="Gráfico do histórico de luminosidade"></canvas>
    <div class="tabela">
      <table><thead><tr><th>Horário</th><th>Valor</th><th>Alerta</th></tr></thead><tbody id="corpo"></tbody></table>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR");

function el(tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

const dados = {};          // id do comodo -> resposta da API
let selecionado = CONFIG.COMODOS[0].id;
const nos = {};            // id do comodo -> elementos SVG

/* ---------- desenha a planta ---------- */
function montaPlanta() {
  const svg = $("planta");
  const xs = CONFIG.COMODOS.map(c => c.x), ys = CONFIG.COMODOS.map(c => c.y);
  const x2 = Math.max(...CONFIG.COMODOS.map(c => c.x + c.w)), y2 = Math.max(...CONFIG.COMODOS.map(c => c.y + c.h));
  svg.appendChild(el("rect", { class: "piso", x: Math.min(...xs) - 10, y: Math.min(...ys) - 10,
    width: x2 - Math.min(...xs) + 20, height: y2 - Math.min(...ys) + 20, rx: 8 }));

  CONFIG.COMODOS.forEach((c) => {
    const g = el("g", { class: "room vazio", tabindex: 0, role: "button", "data-id": c.id });
    g.appendChild(el("rect", { class: "fundo", x: c.x, y: c.y, width: c.w, height: c.h }));
    g.appendChild(el("rect", { class: "halo", x: c.x + 5, y: c.y + 5, width: c.w - 10, height: c.h - 10,
      fill: "none", stroke: "#ff3b30", "stroke-width": 4, opacity: 0 }));
    const n = {
      g,
      valor: el("text", { class: "valor", x: c.x + c.w / 2, y: c.y + c.h / 2 + 18, "text-anchor": "middle" }, "--"),
      estado: el("text", { class: "estado", x: c.x + c.w / 2, y: c.y + c.h / 2 + 44, "text-anchor": "middle" }, "Aguardando"),
      led: el("circle", { class: "led-off", cx: c.x + c.w - 22, cy: c.y + 26, r: 8, stroke: "#00000055", "stroke-width": 1 }),
    };
    g.appendChild(el("text", { class: "nome", x: c.x + 16, y: c.y + 32 }, c.nome));
    g.appendChild(n.valor); g.appendChild(n.estado); g.appendChild(n.led);
    g.addEventListener("click", () => seleciona(c.id));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); seleciona(c.id); } });
    svg.appendChild(g);
    nos[c.id] = n;
  });

  // contorno externo da casa e portas
  const ext = { x: Math.min(...xs), y: Math.min(...ys), w: x2 - Math.min(...xs), h: y2 - Math.min(...ys) };
  svg.appendChild(el("rect", { class: "parede", x: ext.x, y: ext.y, width: ext.w, height: ext.h }));
  (CONFIG.PORTAS || []).forEach((p) => {
    svg.appendChild(el("line", { class: "porta", x1: p.x, y1: p.y, x2: p.vertical ? p.x : p.x + p.len, y2: p.vertical ? p.y + p.len : p.y }));
  });
}

/* ---------- estado de cada comodo ---------- */
function idade(d) { return (new Date(d.agora) - new Date(d.ultima.criado_em)) / 1000; }

function estadoDe(id) {
  const d = dados[id];
  if (!d || !d.ultima) return "vazio";
  if (idade(d) > CONFIG.DESATUALIZADO_APOS_S) return "stale";
  return d.ultima.alerta ? "alerta" : "ok";
}

function pintaComodo(c) {
  const st = estadoDe(c.id), n = nos[c.id], d = dados[c.id];
  n.g.setAttribute("class", "room " + st + (c.id === selecionado ? " sel" : ""));
  const u = d && d.ultima;
  n.valor.textContent = u ? u.valor + "%" : "--";
  n.estado.textContent = { ok: "Com luz", alerta: "ESCURO - emergência", stale: "Sem sinal", vazio: "Sem leituras" }[st];
  n.led.setAttribute("class", st === "alerta" ? "led-on" : "led-off");
  n.g.setAttribute("aria-label", c.nome + ": " + (u ? u.valor + "% de luminosidade, " : "") + n.estado.textContent);
}

function pintaResumo() {
  const est = CONFIG.COMODOS.map(c => estadoDe(c.id));
  const alertas = est.filter(s => s === "alerta").length, ok = est.filter(s => s === "ok").length;
  const sem = est.filter(s => s === "stale" || s === "vazio").length;
  const r = $("resumo"); r.replaceChildren();
  const add = (t, cls) => { const s = document.createElement("span"); s.className = "pill " + (cls || ""); s.textContent = t; r.appendChild(s); };
  add(ok + " com luz");
  add(alertas + (alertas === 1 ? " em alerta" : " em alerta"), alertas ? "bad" : "");
  if (sem) add(sem + " sem sinal");
}

/* ---------- detalhe do comodo selecionado ---------- */
function desenhaGrafico(hist) {
  const cv = $("grafico"), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = cv.clientWidth, h = cv.clientHeight, m = 28;
  c.clearRect(0, 0, w, h);
  const y = (v) => h - m - (v / 100) * (h - 2 * m);
  c.font = "11px system-ui"; c.fillStyle = css("--mut"); c.strokeStyle = "rgba(128,128,128,.3)"; c.lineWidth = 1;
  [0, 50, 100].forEach((v) => { c.beginPath(); c.moveTo(m, y(v)); c.lineTo(w - 8, y(v)); c.stroke(); c.fillText(v, 2, y(v) + 4); });
  c.strokeStyle = css("--bad"); c.setLineDash([5, 4]);
  c.beginPath(); c.moveTo(m, y(CONFIG.LIMITE_ALERTA)); c.lineTo(w - 8, y(CONFIG.LIMITE_ALERTA)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = css("--bad"); c.fillText("limite " + CONFIG.LIMITE_ALERTA + "%", w - 70, y(CONFIG.LIMITE_ALERTA) - 4);
  const pts = [...hist].reverse();
  if (pts.length < 2) return;
  c.strokeStyle = css("--linha"); c.lineWidth = 2; c.beginPath();
  pts.forEach((p, i) => {
    const x = m + (i / (pts.length - 1)) * (w - m - 8);
    i ? c.lineTo(x, y(p.valor)) : c.moveTo(x, y(p.valor));
  });
  c.stroke();
}

function mostraDetalhe() {
  const com = CONFIG.COMODOS.find(c => c.id === selecionado), d = dados[selecionado];
  $("d-nome").textContent = com.nome;
  $("d-dev").textContent = "Sensor: " + com.device_id;
  const corpo = $("corpo"); corpo.replaceChildren();
  const al = $("d-alerta");
  if (!d || !d.ultima) {
    $("d-valor").textContent = "--"; $("d-unidade").textContent = ""; $("d-hora").textContent = "--";
    $("d-msg").textContent = "Ainda não há leituras deste cômodo.";
    al.textContent = "Aguardando"; al.className = "badge b-warn";
    desenhaGrafico([]); return;
  }
  const u = d.ultima, st = estadoDe(selecionado);
  $("d-valor").textContent = u.valor; $("d-unidade").textContent = u.unidade;
  $("d-hora").textContent = new Date(u.criado_em).toLocaleString("pt-BR");
  al.textContent = u.alerta ? "ALERTA: sem luz (LED aceso)" : "Normal: com luz (LED apagado)";
  al.className = "badge " + (u.alerta ? "b-bad" : "b-ok");
  $("d-msg").textContent = st === "stale"
    ? "Sem leituras novas há " + Math.round(idade(d)) + " s. Transmissão interrompida?" : "";
  d.historico.slice(0, 30).forEach((r) => {
    const tr = corpo.insertRow();
    tr.insertCell().textContent = hora(r.criado_em);
    tr.insertCell().textContent = r.valor + " " + r.unidade;
    tr.insertCell().textContent = r.alerta ? "Sim" : "Não";
  });
  desenhaGrafico(d.historico);
}

function seleciona(id) {
  selecionado = id;
  CONFIG.COMODOS.forEach(pintaComodo);
  mostraDetalhe();
}

/* ---------- consulta a API (um sensor por comodo) ---------- */
async function consulta(c) {
  const q = new URLSearchParams({ device_id: c.device_id, grandeza: CONFIG.GRANDEZA, limit: 50 });
  const r = await fetch(CONFIG.API_URL + "?" + q);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function atualiza() {
  const res = await Promise.allSettled(CONFIG.COMODOS.map(consulta));
  res.forEach((r, i) => { if (r.status === "fulfilled") dados[CONFIG.COMODOS[i].id] = r.value; });
  CONFIG.COMODOS.forEach(pintaComodo);
  pintaResumo();
  mostraDetalhe();
  const falhas = res.filter(r => r.status === "rejected").length;
  if (falhas === res.length) $("d-msg").textContent = "Não foi possível consultar a API.";
}

montaPlanta();
atualiza();
setInterval(atualiza, CONFIG.ATUALIZA_A_CADA_S * 1000);
window.addEventListener("resize", mostraDetalhe);
</script>
</body>
</html>
